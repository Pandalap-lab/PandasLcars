name: PandasLcars Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core behavior
        run: dotnet run --project PandaLcarsTactical.Tests -c Release
      - name: Test zoom
        run: node PandaLcarsTactical.Tests/zoom.test.cjs
      - name: Test Earth rotation
        run: node PandaLcarsTactical.Tests/earth-motion.test.cjs
      - name: Test dashboard in Edge
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/pandas-ui" --ignore-scripts --no-package-lock playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'UI test dependency installation failed' }
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/pandas-ui/node_modules/playwright"
          node PandaLcarsTactical.Tests/dashboard.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
      - name: Save UI test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UI-test-diagnostics
          path: qa/*.png
      - name: Build Windows x64
        run: dotnet publish PandaLcarsTactical/PandaLcarsTactical.csproj -c Release -p:Platform=x64 -o artifacts/app
      - name: Second visual and behavior check on published build
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/pandas-ui/node_modules/playwright"
          $env:PANDA_ASSETS_ROOT = (Resolve-Path artifacts/app/Assets).Path
          node PandaLcarsTactical.Tests/dashboard.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Published build visual tests failed' }
      - name: Preserve successful visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: Verified-UI-screenshots
          path: qa/*.png
      - name: Package installer and portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content PandaLcarsTactical/PandaLcarsTactical.csproj)).Project.PropertyGroup.Version
          Copy-Item README.md,PandaLcarsTactical/CHANGELOG.md artifacts/app
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and app version must match.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $compiler "/DAppVersion=$version" installer/PandasLcars.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Compress-Archive artifacts/app/* artifacts/PandasLcars-Windows-x64.zip
          Get-FileHash artifacts/PandasLcars-Setup.exe,artifacts/PandasLcars-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - name: Get 0.6.4 source for upgrade test
        uses: actions/checkout@v4
        with:
          ref: v0.6.4
          path: upgrade-baseline
      - name: Build previous installer
        shell: pwsh
        run: |
          dotnet publish upgrade-baseline/PandaLcarsTactical/PandaLcarsTactical.csproj -c Release -p:Platform=x64 -o upgrade-baseline/artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DAppVersion=0.6.4 upgrade-baseline/installer/PandasLcars.iss
          if ($LASTEXITCODE -ne 0) { throw 'Baseline installer failed' }
      - name: Test installation, upgrade and uninstall on clean runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content PandaLcarsTactical/PandaLcarsTactical.csproj)).Project.PropertyGroup.Version
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/PandasLcars'
          $dataDir = Join-Path $env:LOCALAPPDATA 'PandaLcarsTactical'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir 'qa-preservation.txt'
          Set-Content $sentinel 'keep-personal-settings'
          $displayFile = Join-Path $dataDir 'display.json'
          Set-Content $displayFile '{"monitorId":"upgrade-test-monitor","fullscreen":true}'
          $displayHash = (Get-FileHash $displayFile).Hash
          $linksFile = Join-Path $dataDir 'quicklaunch.json'
          Set-Content $linksFile '[{"Id":"2a1d86c4-a839-42f0-9f84-b4d271190184","Name":"Upgrade test","Url":"https://example.com/","Custom":true}]'
          $linksHash = (Get-FileHash $linksFile).Hash
          $baseline = (Resolve-Path upgrade-baseline/artifacts/PandasLcars-Setup.exe).Path
          $initial = Start-Process -FilePath $baseline -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -WindowStyle Hidden -Wait -PassThru
          if ($initial.ExitCode -ne 0) { throw 'Baseline install failed' }
          if ((Get-Item (Join-Path $appDir 'PandasLcars.exe')).VersionInfo.FileVersion -ne '0.6.4.0') { throw 'Baseline version mismatch' }
          $setup = (Resolve-Path artifacts/PandasLcars-Setup.exe).Path
          foreach ($attempt in 1..2) {
            $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=autostart' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if (!(Test-Path (Join-Path $appDir 'PandasLcars.exe'))) { throw 'Installed executable missing' }
            if ((Get-Content $sentinel) -ne 'keep-personal-settings') { throw 'Personal settings changed' }
            if ((Get-FileHash $displayFile).Hash -ne $displayHash) { throw 'Display settings changed' }
            if ((Get-FileHash $linksFile).Hash -ne $linksHash) { throw 'Custom links changed' }
            if ((Get-Item (Join-Path $appDir 'PandasLcars.exe')).VersionInfo.FileVersion -ne "$version.0") { throw 'Updated executable version mismatch' }
          }
          $runKey = 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Run'
          if ((Get-ItemPropertyValue $runKey PandasLcars) -notlike '*PandasLcars.exe*--autostart') { throw 'Autostart entry missing' }
          $uninstall = Start-Process -FilePath (Join-Path $appDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path (Join-Path $appDir 'PandasLcars.exe')) { throw 'App was not removed' }
          if ((Get-Content $sentinel) -ne 'keep-personal-settings') { throw 'Uninstall removed user settings' }
          if ((Get-FileHash $displayFile).Hash -ne $displayHash) { throw 'Uninstall removed display settings' }
          if ((Get-FileHash $linksFile).Hash -ne $linksHash) { throw 'Uninstall removed custom links' }
          $remaining = Get-ItemProperty $runKey -ErrorAction SilentlyContinue
          if ($remaining -and $remaining.PSObject.Properties.Name -contains 'PandasLcars') { throw 'Uninstall left autostart behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: PandasLcars-Windows-x64
          path: |
            artifacts/PandasLcars-Setup.exe
            artifacts/PandasLcars-Windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PandasLcars-Windows-x64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --verify-tag --title "PandasLcars $TAG" --notes-file "docs/release-${TAG#v}.md"
